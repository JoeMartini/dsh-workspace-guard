# The workspace-guard bundle: inserts the guard plugin after the services
# it wraps (directoryPicker, workspaceRegistry, agents) have mounted.
#
# The root defaults to $DSH_WORKSPACE_ROOT || process.cwd(). To customize,
# DO NOT insert a second workspace-guard entry — instead, override by id
# in your profile's cordis.patch.yml:
#
#   - id: workspace-guard
#     config:
#       root: /workspaces/tenant-a
#
- insert:
    - id: workspace-guard
      name: '@deepseek-ai/dsh-workspace-guard'
      config:
        root: !!js process.env.DSH_WORKSPACE_ROOT ?? process.cwd()
